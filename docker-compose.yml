services:
  # 1. Base de datos MySQL 8.0 con inicialización automática de esquema y seed
  db:
    image: mysql:8.0
    container_name: psicologia_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cartillas_psicologicas
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./api/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Servidor Backend Express + TypeScript
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: psicologia_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: cartillas_psicologicas
      JWT_SECRET: secret_psicocartillas_123_production
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend React (Vite) servido por Nginx Reverse Proxy
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: psicologia_client
    restart: always
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://api:5000/api/
    depends_on:
      - api

volumes:
  mysql_data:
